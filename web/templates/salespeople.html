{{define "salespeople"}}
<div class="stack">
  <section class="card">
    <div class="card-head">
      <div><h2>Daftar Sales</h2><p id="salesCount">Memuat data sales...</p></div>
      <button class="btn btn-success head-tools" id="addSales" type="button">{{template "icon" (dict "Name" "plus")}} Tambah Sales</button>
    </div>
    <div class="tablewrap">
      <table class="grid">
        <thead><tr><th>Nama Sales</th><th>Komisi</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="salespersonRows"></tbody>
      </table>
    </div>
    <div class="tablefoot"><span>Daftar ini digunakan pada pilihan Sales di Transaksi Baru.</span></div>
  </section>
</div>
{{end}}
